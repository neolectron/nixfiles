packages:
  - packages/*
  # This existing Nix derivation owns its npm lockfile; do not migrate it.
  - '!packages/node-global-packages'

engineStrict: true
strictDepBuilds: true
allowBuilds:
  # tsx's JSX transformer; needed for Node's runtime loader.
  esbuild: true
  # Native HID driver only; no blanket install-script approval.
  node-hid: true
  # Optional JPEG accelerator; the small demos use the pure-JS fallback.
  '@julusian/jpeg-turbo': false
minimumReleaseAgeExclude:
  # Preserve the exact pin already validated by the keep-awake worker.
  - zod@4.6.7
  - '@effect/platform-node-shared@4.0.4'
  - '@effect/platform-node@4.0.4'
  - effect@4.0.4
  - '@effect/vitest@4.0.4'
  - '@takumi-rs/core-darwin-arm64@2.15.2'
  - '@takumi-rs/core-darwin-x64@2.15.2'
  - '@takumi-rs/core-linux-arm64-gnu@2.15.2'
  - '@takumi-rs/core-linux-arm64-musl@2.15.2'
  - '@takumi-rs/core-linux-x64-gnu@2.15.2'
  - '@takumi-rs/core-linux-x64-musl@2.15.2'
  - '@takumi-rs/core-win32-arm64-msvc@2.15.2'
  - '@takumi-rs/core-win32-x64-msvc@2.15.2'
  - '@takumi-rs/core@2.15.2'
  - '@takumi-rs/helpers@2.15.2'
